upstream nginx-backend {
     server app-1:5001;
     server app-2:5001;
}

server {
    listen 80;

    location / {
        proxy_pass http://nginx-backend;
        
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s; 
        proxy_send_timeout 30s;

        proxy_next_upstream error http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
