services:
  postgres:
    image: postgres:16.2
    container_name: social-network-db
    environment:
      POSTGRES_DB: social_network
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./volumes/social-network-db:/var/lib/postgresql/data
    networks:
      - social-network

  pgslave:
    image: postgres:16.2
    container_name: pgslave
    environment:
      POSTGRES_DB: social_network
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "15432:5432"
    volumes:
      - pgslave_data:/var/lib/postgresql/data
      - ./volumes/pgslave:/var/lib/postgresql/data
    networks:
      - social-network

  pgasyncslave:
    image: postgres:16.2
    container_name: pgasyncslave
    environment:
      POSTGRES_DB: social_network
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "25432:5432"
    volumes:
      - pgasyncslave_data:/var/lib/postgresql/data
      - ./volumes/pgasyncslave:/var/lib/postgresql/data
    networks:
      - social-network

  redis:
    image: redis:7-alpine
    container_name: social-network-redis
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    networks:
      - social-network

  rabbitmq-1:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-1
    ports:
      - "5674:5672"
      - "15674:15672"
    environment:
      RABBITMQ_NODENAME: rabbit@rabbitmq-1
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_ERLANG_COOKIE: "7e8132a2-70eb-4f5d-a074-a96d476bdcb6"
    volumes:
      - rabbitmq_data_1:/var/lib/rabbitmq
    networks:
      - social-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  rabbitmq-2:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-2
    ports:
      - "5675:5672"
      - "15675:15672"
    environment:
      RABBITMQ_NODENAME: rabbit@rabbitmq-2
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_ERLANG_COOKIE: "7e8132a2-70eb-4f5d-a074-a96d476bdcb6"
    volumes:
      - rabbitmq_data_2:/var/lib/rabbitmq
    networks:
      - social-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  rabbitmq-3:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-3
    ports:
      - "5676:5672"
      - "15676:15672"
    environment:
      RABBITMQ_NODENAME: rabbit@rabbitmq-3
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_ERLANG_COOKIE: "7e8132a2-70eb-4f5d-a074-a96d476bdcb6"
    volumes:
      - rabbitmq_data_3:/var/lib/rabbitmq
    networks:
      - social-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  app:
    build: .
    container_name: social-network-app
    restart: unless-stopped
    volumes:
      - ./people.csv:/app/people.csv
      - ./posts.txt:/app/posts.txt
    working_dir: /app
    environment:
      - CSV_PEOPLE_PATH=/app/people.csv
      - CSV_POSTS_PATH=/app/posts.txt

    ports:
      - "5001:5001"
    networks:
      - social-network
    depends_on:
      - postgres
      - redis
  ws-1:
    build:
      context: .
      dockerfile: Dockerfile.websocket
    container_name: social-network-ws-1
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=social_network
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
    networks:
      - social-network
    ports:
      - "8082:8082"
    depends_on:
      - app
    restart: unless-stopped
  citus-coordinator:
    image: citusdata/citus:12.1.3
    container_name: citus-coordinator
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: citus_password
      POSTGRES_DB: chat_service
      POSTGRES_HOST_AUTH_METHOD: trust
    command: >
      postgres
      -c wal_level=logical
      -c max_prepared_transactions=128
    ports:
      - "6432:5432"
    volumes:
      - citus_coordinator_data:/var/lib/postgresql/data
    networks:
      - social-network

  citus-worker-1:
    image: citusdata/citus:12.1.3
    container_name: citus-worker-1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: citus_password
      POSTGRES_DB: chat_service
      POSTGRES_HOST_AUTH_METHOD: trust
    command: >
      postgres
      -c wal_level=logical
      -c max_prepared_transactions=128
    volumes:
      - citus_worker_1_data:/var/lib/postgresql/data
    networks:
      - social-network
    depends_on:
      citus-coordinator:
        condition: service_healthy

  citus-worker-2:
    image: citusdata/citus:12.1.3
    container_name: citus-worker-2
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: citus_password
      POSTGRES_DB: chat_service
      POSTGRES_HOST_AUTH_METHOD: trust
    command: >
      postgres
      -c wal_level=logical
      -c max_prepared_transactions=128
    volumes:
      - citus_worker_2_data:/var/lib/postgresql/data
    networks:
      - social-network
    depends_on:
      citus-coordinator:
        condition: service_healthy

  chat-service:
    build:
      context: ./chat-service
      dockerfile: Dockerfile
    container_name: chat-service
    restart: unless-stopped
    ports:
      - "15001:5001"
    networks:
      - social-network
    depends_on:
      citus-coordinator:
        condition: service_healthy
      citus-worker-1:
        condition: service_healthy
    environment:
      CITUS_HOST: citus-coordinator
      CITUS_PORT: 5432
      CITUS_DB: chat_service
      CITUS_USER: postgres
      CITUS_PASSWORD: citus_password
      APP_HOST: app
      APP_PORT: 5001
    volumes:
      - ./users.csv:/app/users.csv

volumes:
  postgres_data:
    driver: local
  pgslave_data:
    driver: local
  pgasyncslave_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data_1:
   driver: local
  rabbitmq_data_2:
   driver: local
  rabbitmq_data_3:
   driver: local
  go-mod-cache:
    driver: local
  citus_coordinator_data:
    driver: local
  citus_worker_1_data:
    driver: local
  citus_worker_2_data:
    driver: local

networks:
  social-network:
    driver: bridge